name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate test fixtures
        run: npm run fixtures

      - name: Unit tests
        run: npm test

      - name: Verify locate on real Windows (PE version, registry, running game)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installDir = (Resolve-Path 'test/fixtures/clean/Program Files/EA Games/The Sims 4').Path
          $exePath = Join-Path $installDir 'Game\Bin\TS4_x64.exe'

          # (1) Check the fixture PE with PowerShell FileVersionInfo
          $peVersion = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exePath).FileVersion
          if ($peVersion -ne '1.129.39.1030') {
            throw "Expected fixture PE FileVersion '1.129.39.1030', got '$peVersion'"
          }
          Write-Host "PE FileVersionInfo OK: $peVersion"

          # (2) Write HKLM WOW6432Node Install Dir and run locate through its real Host
          $regPath = 'HKLM:\SOFTWARE\WOW6432Node\Maxis\The Sims 4'
          $tempDir = Join-Path $env:TEMP "sims-helper-locate-ci-$PID"
          $proc = $null
          try {
            New-Item -Path $regPath -Force | Out-Null
            Set-ItemProperty -Path $regPath -Name 'Install Dir' -Value $installDir

            $locateJson = (npm run --silent locate -- --real) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "npm run locate -- --real failed" }
            $result = $locateJson | ConvertFrom-Json
            if ($result.gameInstall.path -ne $installDir) {
              throw "Expected gameInstall.path '$installDir', got '$($result.gameInstall.path)'"
            }
            if ($result.gameInstall.version -ne '1.129.39.1030') {
              throw "Expected gameInstall.version '1.129.39.1030', got '$($result.gameInstall.version)'"
            }
            $packs = ($result.gameInstall.packs -join ',')
            if ($packs -ne 'EP01,EP02,FP01,GP02,SP18') {
              throw "Expected packs 'EP01,EP02,FP01,GP02,SP18', got '$packs'"
            }
            if ($result.gameRunning -ne $false) {
              throw "Expected gameRunning=false before starting dummy process"
            }
            Write-Host "Registry + real Host locate OK: $($result.gameInstall.path) ($($result.gameInstall.version))"

            # (3) Copy a small exe as TS4_x64.exe, start it, assert gameRunning=true, then stop it
            New-Item -ItemType Directory -Path $tempDir -Force | Out-Null
            $fakeExe = Join-Path $tempDir 'TS4_x64.exe'
            Copy-Item -Path (Join-Path $env:SystemRoot 'System32\cmd.exe') -Destination $fakeExe
            $proc = Start-Process -FilePath $fakeExe -ArgumentList '/c','ping -n 30 127.0.0.1 >nul' -PassThru -WindowStyle Hidden
            Start-Sleep -Milliseconds 300

            $runningJson = (npm run --silent locate -- --real) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "npm run locate -- --real failed while game running" }
            $runningResult = $runningJson | ConvertFrom-Json
            if ($runningResult.gameRunning -ne $true) {
              throw "Expected gameRunning=true while dummy TS4_x64.exe is running"
            }
            Write-Host "Running-game check OK: gameRunning=$($runningResult.gameRunning)"
          } finally {
            if ($proc -and -not $proc.HasExited) {
              & taskkill /F /T /PID $proc.Id 2>$null | Out-Null
            }
            if (Test-Path $tempDir) {
              Remove-Item -Path $tempDir -Recurse -Force -ErrorAction SilentlyContinue
            }
            if (Test-Path $regPath) {
              Remove-Item -Path $regPath -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Build Windows installer
        run: npm run dist:win

      - name: Verify installer size
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installerName = "Sims Helper Setup $version.exe"
          $installerPath = Join-Path (Resolve-Path dist) $installerName
          if (-not (Test-Path $installerPath)) {
            Get-ChildItem dist
            throw "Expected installer not found at: $installerPath"
          }
          $bytes = (Get-Item $installerPath).Length
          $mb = [math]::Round($bytes / 1MB, 2)
          Write-Host "Installer: $installerName"
          Write-Host "Installer size: $bytes bytes ($mb MB)"
          $maxBytes = 200 * 1024 * 1024
          if ($bytes -gt $maxBytes) {
            throw "Installer size ($bytes bytes) exceeds 200 MB limit ($maxBytes bytes)"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALLER_PATH=$installerPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install silently and locate executable
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath $env:INSTALLER_PATH -ArgumentList '/S' -Wait -PassThru
          if ($proc.ExitCode -ne 0) {
            throw "Silent install failed with exit code $($proc.ExitCode)"
          }
          $installedExe = Join-Path $env:LOCALAPPDATA "Programs\Sims Helper\Sims Helper.exe"
          if (-not (Test-Path $installedExe)) {
            throw "Installed executable not found at: $installedExe"
          }
          Write-Host "Installed executable: $installedExe"
          "SIMS_HELPER_EXE=$installedExe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify installed app with Playwright
        run: npm run test:e2e

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sims Helper Setup ${{ env.APP_VERSION }}
          path: ${{ env.INSTALLER_PATH }}
          if-no-files-found: error
