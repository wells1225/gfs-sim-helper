appId: com.tyler.sims-helper
productName: Sims Helper
forceCodeSigning: false
publish:
  provider: github
  owner: wells1225
  repo: gfs-sim-helper

directories:
  buildResources: build
  output: dist

files:
  - out/**/*
  - build/icon.png
  - package.json

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Sims Helper
  artifactName: "Sims Helper Setup ${version}.exe"
  include: build/installer.nsh
  unicode: true
  differentialPackage: false
